[tools]
"aqua:owenlamont/ryl" = "0.22.0"
"pipx:codespell" = "2.4.3"
actionlint = "1.7.12"
editorconfig-checker = "4.0.1"
gitleaks = "8.30.1"
hk = "2.0.1"
markdownlint-cli2 = "0.23.2"
pkl = "0.32.1"

[tasks.lint]
alias = "l"
description = "Lint the codebase"
run = "hk check --all"

[tasks.format]
alias = "fmt"
description = "Format the codebase"
run = "hk fix --all"

[tasks.postlint]
description = "Run post-lint checks"
run = "git diff --exit-code"
