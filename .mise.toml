[tools]
"aqua:owenlamont/ryl" = "0.28.0"
"github:immanuwell/dockerfile-roast" = "1.7.0"
"pipx:codespell" = "2.4.3"
betterleaks = "1.10.0"
editorconfig-checker = "4.0.2"
hk = "2.11.1"
jactionlint = "2.4.0"
markdownlint-cli2 = "0.24.0"
pkl = "0.33.0"
typos = "1.52.0"

[tasks.lint]
alias = "l"
description = "Lint the codebase"
run = "hk check --all"

[tasks.format]
alias = "fmt"
description = "Format the codebase"
run = "hk fix --all"

[tasks.postlint]
description = "Run post-lint checks"
run = "git diff --exit-code"
