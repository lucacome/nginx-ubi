[tools]
"aqua:owenlamont/ryl" = "0.22.0"
"github:immanuwell/dockerfile-roast" = "1.7.0"
"github:kjanat/actionlint" = "1.17.0"
"pipx:codespell" = "2.4.3"
betterleaks = "1.8.1"
editorconfig-checker = "4.0.2"
hk = "2.3.0"
markdownlint-cli2 = "0.23.3"
pkl = "0.32.1"
typos = "1.50.3"

[tasks.lint]
alias = "l"
description = "Lint the codebase"
run = "hk check --all"

[tasks.format]
alias = "fmt"
description = "Format the codebase"
run = "hk fix --all"

[tasks.postlint]
description = "Run post-lint checks"
run = "git diff --exit-code"
