name: 'Dependency Review'
on: [pull_request]

concurrency:
  group: ${{ github.ref_name }}-deps-review
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 'Checkout Repository'
        uses: actions/checkout@v7.0.1
      - name: 'Dependency Review'
        uses: actions/dependency-review-action@v5.0.0
